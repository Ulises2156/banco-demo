spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/banco
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
        show-sql: true
        properties:
          hibernate:
            format_sql: true
            dialect: org.hibernate.dialect.PostgresSQLDialect

  server:
    port: 8080